[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cachemind"
version = "0.1.0"
description = "CacheMind - learning-augmented cache replacement with ML and real-time Big Data analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins for the compatibility-critical stack; the full resolved set is in
# requirements.lock (generated by `make lock` from a tested environment).
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "pyspark==4.0.4",
  "confluent-kafka==2.11.1",
  "requests==2.32.3",
  "streamlit==1.50.0",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-timeout==2.3.1",
  "pytest-cov==6.0.0",
  "hypothesis==6.131.0",
  "ruff==0.12.12",
  "mypy==1.15.0",
  "types-requests",
]

[project.scripts]
cachemind = "cachemind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cachemind = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
  "spark: requires a local JVM + PySpark (no external services)",
  "kafka: requires a running Kafka broker",
  "hbase: requires a running HBase REST gateway",
  "e2e: full end-to-end pipeline across Kafka, Spark and HBase",
  "slow: long-running test",
  "performance: benchmark-style test",
]
filterwarnings = [
  "ignore::DeprecationWarning:pyspark.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913",  # many-argument constructors for configs are clearer than kwargs dicts
  "PLR2004",  # magic numbers are common in tests / data generation
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "S101",     # assert is used for invariants in tests and simulator debug checks
  "RUF001",
  "RUF002",
  "RUF003",
  # Deliberate lazy imports: PySpark / confluent-kafka / Streamlit are imported only on the
  # code paths that need them, so the lightweight profile (A) never loads a JVM or Kafka.
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE001"]
"scripts/**" = ["S", "T201"]
# Fixed argument lists, never shell=True; inputs are project paths and validated ids.
"src/cachemind/ops/infra.py" = ["S603"]
"src/cachemind/experiments/streaming_experiments.py" = ["S603"]
# Synthetic data generation / fault injection: non-cryptographic randomness is intended.
"src/cachemind/data/generator.py" = ["S311"]
"src/cachemind/bigdata/kafka_io.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/cachemind"]
exclude = ["src/cachemind/dashboard/"]

[tool.coverage.run]
source = ["cachemind"]
branch = true
