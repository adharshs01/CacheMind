# CacheMind Profile C: full end-to-end stack.
#   docker compose -f infra/docker/docker-compose.yml up -d kafka hbase
#   docker compose -f infra/docker/docker-compose.yml up -d streaming dashboard
#   docker compose -f infra/docker/docker-compose.yml run --rm app python -m cachemind pipeline-demo
#
# Resource guidance: the Docker VM needs ~6 GB RAM for this stack (Kafka 0.5 GB, HBase 1 GB,
# streaming Spark driver 2 GB, batch jobs 2 GB, dashboard 0.5 GB). On an 8 GB laptop use the
# native Profile B/C commands instead (make infra-up) or a 16 GB+ machine.
# Every port is published on 127.0.0.1 only. No authentication: development use only.

name: cachemind

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/app/Dockerfile
  image: cachemind-app:0.1.0
  environment:
    CACHEMIND_KAFKA_BOOTSTRAP: kafka:19092
    CACHEMIND_KAFKA_TOPIC: cachemind.requests.v1
    CACHEMIND_HBASE_REST_URL: http://hbase:8080
    CACHEMIND_SPARK_DRIVER_MEMORY: 1536m
    CACHEMIND_SPARK_MASTER: local[2]
  volumes:
    - cachemind-data:/data
  depends_on:
    kafka:
      condition: service_healthy
    hbase:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # base64 UUID (22 chars), required by KRaft
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  hbase:
    build:
      context: ./hbase
    image: cachemind-hbase:2.6.7
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:16010:16010"
    volumes:
      - hbase-data:/data
    mem_limit: 1280m

  init:
    <<: *app
    command: ["sh", "-c", "python -m cachemind infra topic && python -m cachemind hbase-init"]
    restart: "no"

  streaming:
    <<: *app
    command: ["python", "-m", "cachemind", "stream", "run"]
    mem_limit: 2560m
    restart: on-failure:5
    stop_signal: SIGINT
    stop_grace_period: 60s

  dashboard:
    <<: *app
    command: ["python", "-m", "streamlit", "run", "src/cachemind/dashboard/app.py",
              "--server.address", "0.0.0.0"]
    environment:
      CACHEMIND_KAFKA_BOOTSTRAP: kafka:19092
      CACHEMIND_HBASE_REST_URL: http://hbase:8080
    ports:
      - "127.0.0.1:8501:8501"
    mem_limit: 768m

  app:
    <<: *app
    profiles: ["tools"]
    mem_limit: 2560m

volumes:
  cachemind-data:
  kafka-data:
  hbase-data:
