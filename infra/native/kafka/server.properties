# CacheMind single-node Kafka (KRaft combined broker+controller) for LOCAL DEVELOPMENT.
# Rendered by `python -m cachemind.ops.infra up kafka`; dollar-brace placeholders are substituted.
# Bound to 127.0.0.1 only. No authentication: never expose this broker to a network.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:${KAFKA_CONTROLLER_PORT}
listeners=PLAINTEXT://127.0.0.1:${KAFKA_PORT},CONTROLLER://127.0.0.1:${KAFKA_CONTROLLER_PORT}
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://127.0.0.1:${KAFKA_PORT},CONTROLLER://127.0.0.1:${KAFKA_CONTROLLER_PORT}
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
# Small thread pools: this broker serves one laptop.
num.network.threads=2
num.io.threads=2
background.threads=4
num.recovery.threads.per.data.dir=1
log.dirs=${KAFKA_DATA_DIR}
num.partitions=3
auto.create.topics.enable=false
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
# DEV-ONLY tolerance: on a memory-constrained laptop the JVM can stall for seconds
# (swap). The default 9s broker session would fence the broker and unload consumer
# groups; 30s rides out short stalls. Production clusters should keep defaults.
broker.session.timeout.ms=30000
broker.heartbeat.interval.ms=3000
# Retention is NOT permanent storage: durable copies live in the Bronze layer.
log.retention.hours=168
log.segment.bytes=134217728
log.retention.check.interval.ms=300000
